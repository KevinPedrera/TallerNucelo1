<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Registro de usuario</h1><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/registro}" th:object="${usuario}" method="post"><div class="mb-3"><label class="form-label">Nombre completo</label><input class="form-control" th:field="*{nombreCompleto}"><div class="text-danger" th:errors="*{nombreCompleto}"></div></div><div class="mb-3"><label class="form-label">Usuario</label><input class="form-control" th:field="*{username}"><div class="text-danger" th:errors="*{username}"></div></div><div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" th:field="*{password}"><div class="text-danger" th:errors="*{password}"></div></div><button class="btn btn-primary">Registrarme</button> <a class="btn btn-link" th:href="@{/login}">Volver</a></form></div></div></div></div></main></body></html>
