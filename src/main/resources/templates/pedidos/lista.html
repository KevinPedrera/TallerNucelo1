<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container"><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div class="d-flex justify-content-between align-items-center"><div><h1>Pedidos</h1><p class="text-muted">Consulta de pedidos asociados al usuario autenticado.</p></div><a class="btn btn-primary" th:href="@{/pedidos/nuevo}">Nuevo pedido</a></div><table class="table table-striped"><thead class="table-dark"><tr><th>ID</th><th>Fecha</th><th>Dirección</th><th>Estado</th><th>Productos</th></tr></thead><tbody><tr th:each="p : ${pedidos}"><td th:text="${p.id}"></td><td th:text="${p.fecha}"></td><td th:text="${p.direccionEntrega}"></td><td th:text="${p.estado}"></td><td><span th:each="producto, stat : ${p.productos}" th:text="${producto.nombre + (stat.last ? '' : ', ')}"></span></td></tr><tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="5" class="text-center">No hay pedidos registrados.</td></tr></tbody></table></main></body></html>
