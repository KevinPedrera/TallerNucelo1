<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuevo pedido</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container"><h1>Registrar pedido</h1><form class="col-md-8" th:action="@{/pedidos/guardar}" method="post"><div class="mb-3"><label class="form-label">Dirección de entrega</label><input class="form-control" name="direccionEntrega" required maxlength="255"></div><div class="mb-3"><label class="form-label">Productos</label><div class="form-check" th:each="producto : ${productos}"><input class="form-check-input" type="checkbox" name="productoIds" th:value="${producto.id}"><label class="form-check-label" th:text="${producto.nombre + ' - $' + producto.precio}"></label></div></div><button class="btn btn-primary">Registrar pedido</button> <a class="btn btn-link" th:href="@{/pedidos}">Cancelar</a></form></main></body></html>
