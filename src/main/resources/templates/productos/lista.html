<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container"><div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div><div class="d-flex justify-content-between align-items-center mb-3"><h1>Productos</h1><a class="btn btn-primary" th:href="@{/productos/nuevo}">Nuevo producto</a></div><form class="row g-2 mb-4" method="get" th:action="@{/productos}"><div class="col-md-8"><input class="form-control" name="q" th:value="${busqueda}" placeholder="Buscar por nombre"></div><div class="col-auto"><button class="btn btn-outline-primary">Buscar</button></div></form><div class="row mb-4"><div class="col-md-6"><div class="card"><div class="card-body"><small>Unidades disponibles</small><h2 th:text="${unidadesDisponibles}">0</h2></div></div></div><div class="col-md-6"><div class="card"><div class="card-body"><small>Valor del inventario</small><h2 th:text="${valorInventario}">0.00</h2></div></div></div></div><div class="table-responsive"><table class="table table-striped align-middle"><thead class="table-dark"><tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody><tr th:each="p : ${productos}"><td th:text="${p.nombre}"></td><td th:text="${p.categoria.nombre}"></td><td th:text="${p.precio}"></td><td th:text="${p.stock}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{'/productos/'+${p.id}+'/editar'}">Editar</a><form class="d-inline" method="post" th:action="@{'/productos/'+${p.id}+'/eliminar'}"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr><tr th:if="${#lists.isEmpty(productos)}"><td colspan="5" class="text-center">No hay productos registrados.</td></tr></tbody></table></div></main></body></html>
