<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producto</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container"><h1 th:text="${producto.id == null ? 'Registrar producto' : 'Editar producto'}"></h1><form class="col-md-8" th:action="@{/productos/guardar}" th:object="${producto}" method="post"><input type="hidden" th:field="*{id}"><div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}"><div class="text-danger" th:errors="*{nombre}"></div></div><div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" th:field="*{descripcion}"></textarea></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Precio</label><input class="form-control" type="number" step="0.01" th:field="*{precio}"><div class="text-danger" th:errors="*{precio}"></div></div><div class="col-md-6 mb-3"><label class="form-label">Stock</label><input class="form-control" type="number" th:field="*{stock}"><div class="text-danger" th:errors="*{stock}"></div></div></div><div class="mb-3"><label class="form-label">Categoría</label><select class="form-select" name="categoriaId" required><option value="">Seleccione</option><option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}" th:selected="${producto.categoria != null and producto.categoria.id == c.id}"></option></select></div><button class="btn btn-primary">Guardar</button> <a class="btn btn-link" th:href="@{/productos}">Cancelar</a></form></main></body></html>
