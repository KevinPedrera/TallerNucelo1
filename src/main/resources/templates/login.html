<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4">Iniciar sesión</h1><div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos.</div><div th:if="${param.registered}" class="alert alert-success">Registro completado. Inicia sesión.</div><div th:if="${param.logout}" class="alert alert-info">Sesión cerrada.</div><form th:action="@{/login}" method="post"><div class="mb-3"><label class="form-label">Usuario</label><input class="form-control" name="username" required></div><div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" name="password" required></div><button class="btn btn-primary w-100">Ingresar</button></form><a class="d-block mt-3 text-center" th:href="@{/registro}">Crear una cuenta</a></div></div></div></div></main></body></html>
